name: Deploy XploitBase to darkmintis-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout XploitBase repository
        uses: actions/checkout@v4

      - name: Checkout darkmintis-dev
        uses: actions/checkout@v4
        with:
          repository: Darkmintis/darkmintis-dev
          token: ${{ secrets.DEPLOY_PAT }}
          path: main-repo

      - name: Copy production files to main repo
        run: |
          # Remove old deployment
          rm -rf main-repo/dist/xploitbase
          mkdir -p main-repo/dist/xploitbase
          
          # Copy HTML files
          cp index.html main-repo/dist/xploitbase/
          
          # Copy CSS file
          cp styles.css main-repo/dist/xploitbase/
          
          # Copy JavaScript file
          cp app.js main-repo/dist/xploitbase/
          
          # Copy documentation
          cp LICENSE main-repo/dist/xploitbase/
          cp README.md main-repo/dist/xploitbase/
          
          echo "✅ XploitBase production files copied successfully"
          echo "📦 Deployed files:"
          ls -la main-repo/dist/xploitbase/

      - name: Commit and push to darkmintis-dev
        run: |
          cd main-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add changes
          git add dist/xploitbase
          
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to deploy"
          else
            git commit -m "🔄 Update XploitBase from commit ${GITHUB_SHA:0:7}"
            git push
            echo "✅ Changes pushed successfully"
          fi

      - name: Deployment summary
        run: |
          echo "## 🎉 XploitBase Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Tool Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool**: XploitBase - Your Ultimate CTF Companion" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: https://darkmintis.dev/xploitbase" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Key Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Quick Encode/Decode Tools (Base64, URL, Hex, ROT13)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CTF Tools (Hash ID, JWT Decoder, Number Converter, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Payload Generators (Reverse Shells, XSS, SQLi)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Wordlist & Path Generators" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dark/Light Theme Toggle" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All tools work client-side (no server needed)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ One-click copy functionality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Quick Reference Cheatsheets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Files" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ index.html - Main page with all tools" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ styles.css - Clean dark/light theme styling" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ app.js - All tool functionality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ README.md, LICENSE - Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 For CTF Players" >> $GITHUB_STEP_SUMMARY
          echo "XploitBase is a **lightweight browser-based CTF toolkit** with working tools, not just command references. Everything runs client-side - no server, no installation required!" >> $GITHUB_STEP_SUMMARY
